name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes to a PR cancel the older run; every commit on main gets its
# own run so a failure can always be traced to the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Generate Prisma client
        id: prisma
        run: npm run db:generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Type-checks the API, shared package and web app (next build runs tsc)
      - name: Build
        run: npx turbo run build

      # The checks below still run when Build fails, so one CI run reports
      # every problem instead of one per push.

      # skipLibCheck hides an unresolvable import inside Prisma's generated
      # client, which silently turns every model type into `any`
      - name: Type-check API including declaration files
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npx tsc --noEmit -p apps/api --skipLibCheck false

      - name: Type-check e2e tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit -p packages/e2e-tests

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx turbo run lint

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Solidity compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-compilers-${{ runner.os }}-${{ hashFiles('packages/contracts/hardhat.config.ts') }}
          restore-keys: |
            hardhat-compilers-${{ runner.os }}-

      - name: Compile and test contracts
        run: npm test -w @streamtree/contracts

      # Hardhat runs tests transpile-only; this also covers scripts/deploy.ts
      # against the typechain types generated by the compile above
      - name: Type-check contract scripts and tests
        run: npx tsc --noEmit -p packages/contracts

  e2e:
    name: E2E (API + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streamtree
          POSTGRES_PASSWORD: streamtree
          POSTGRES_DB: streamtree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamtree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://streamtree:streamtree@localhost:5432/streamtree?schema=public
      JWT_SECRET: ci-only-jwt-secret
      NODE_ENV: test
      PORT: 3001
      BASE_URL: http://localhost:3001
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build API
        run: npx turbo run build --filter=@streamtree/api

      - name: Create database schema
        working-directory: apps/api
        run: npx prisma db push --skip-generate

      - name: Start API
        working-directory: apps/api
        run: |
          nohup node dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:3001/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API process exited during startup"
              cat "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 1
          done
          echo "API did not become healthy within 30s"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run e2e tests
        run: npm test -w @streamtree/e2e-tests

      - name: Show API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true
